[project]
name = "pysiesta"
version = "0.1.0"
description = "Siesta 💤 — give an idea, answer a few questions, come back to working code. Autonomous dev pipeline with local or remote LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jairo Rodriguez Arias" }, { name = "Luigi Palumbo" }]
keywords = ["ai", "agents", "ollama", "llm", "pipeline", "flet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "flet>=0.28.3",
]

[project.urls]
Homepage = "https://github.com/paluigi-moltis/siesta"
Repository = "https://github.com/paluigi-moltis/siesta"

[project.scripts]
pysiesta = "siesta.gui.app:main"
pysiesta-cli = "siesta.pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siesta"]

[tool.hatch.build.targets.wheel.force-include]
"src/siesta/pipeline" = "siesta/pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
